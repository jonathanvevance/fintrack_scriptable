<!doctype html>
<!-- Laptop preview with fake data. Not installed on the phone (not in manifest.json).
     Loads the same files Scriptable inlines; Save logs the change instead of writing files. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinTrack dashboard preview</title>
<link rel="stylesheet" href="style.css">
<style>body { max-width: 400px; margin: 0 auto; min-height: 100vh; }</style>
</head>
<body>
<div id="app"></div>
<script>var module = { exports: {} };</script>
<script src="../lib/tags.js"></script>
<script>window.FT = { tags: module.exports }; module = { exports: {} };</script>
<script src="../lib/format.js"></script>
<script>FT.format = module.exports; module = { exports: {} };</script>
<script src="../lib/accounts.js"></script>
<script>FT.accounts = module.exports;</script>
<script src="app.js"></script>
<script>
  const MERCHANTS = [
    ["Swiggy", -41200, "HDFC", "5678"], ["Zomato", -38900, "HDFC", "5678"], ["Amazon", -59900, "SBI", "1234"],
    ["Uber", -27600, "ICICI", "246"], ["BLUE TOKAI", -34000, "HDFC", "5678"], ["THIRD WAVE COFFEE", -41000, "ICICI", "246"],
    ["Google", -29900, "ICICI", "246"], ["RAHUL K", -3000000, "SBI", "4321"], ["BIGBASKET", -184500, "SBI", "1234"],
  ];
  const BILLS = [["NETFLIX", -64900, 3], ["HOUSE RENT", -2500000, 1], ["AIRTEL", -99900, 12, true], ["BESCOM", -185000, 18, true], ["SPOTIFY", -11900, 30, true]];
  const months = {};
  for (let back = 0; back < 6; back++) {
    const d = new Date(2026, 9 - back, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const list = [];
    MERCHANTS.forEach(([merchant, paise, bank, account], i) => {
      if ((i + back) % 4 === 3) return;
      const day = String(27 - ((i * 3 + back) % 26)).padStart(2, "0");
      list.push({ id: `${ym}-${i}`, date: `${ym}-${day}`, merchant, bank, account, currency: "INR",
        amountPaise: Math.round(paise * (1 + ((i + back) % 3) / 10)), template: "generic", confidence: "high",
        raw: `Rs ${-paise / 100} debited from A/c XX${account} towards ${merchant}`, capturedAt: `${ym}-${day}T10:00:00Z` });
    });
    BILLS.forEach(([merchant, paise, day, skipNow], i) => {
      if (back === 0 && skipNow) return;
      const date = `${ym}-${String(day).padStart(2, "0")}`;
      list.push({ id: `${ym}-bill${i}`, date, merchant, bank: "SBI", account: "8948", currency: "INR",
        amountPaise: merchant === "BESCOM" ? Math.round(paise * (1 + (back % 3) / 20)) : paise, template: "generic", confidence: "high",
        raw: `Rs ${-paise / 100} debited from A/c XX8948 towards ${merchant}`, capturedAt: `${date}T10:00:00Z` });
    });
    list.push({ id: `${ym}-cb`, date: `${ym}-21`, merchant: null, bank: "SBI", account: null, currency: "INR", amountPaise: 59900,
      template: "generic", confidence: "low", raw: "It's Cashback Time! Rs. 599 has been credited to your CASHBACK SBI Card account", capturedAt: `${ym}-21T10:00:00Z` });
    if (back === 0) list.push(
      { id: "self-in", date: "2026-10-25", merchant: "you.name@sbi", bank: "HSBC", account: "6001", currency: "INR", amountPaise: 2000000, template: "hsbc-upi-credit", confidence: "high",
        raw: "Your HSBC Acc XXXXXX6001 is credited for INR 20,000.00 on 25-Oct-26 from you.name@sbi. UPI Ref No 600000000001", capturedAt: "2026-10-25T10:00:00Z" },
      { id: "self-bill", date: "2026-10-24", merchant: "SBI CARDS AND PAYMENT", bank: "HSBC", account: "6001", currency: "INR", amountPaise: -1543000, template: "hsbc-account-paid", confidence: "high",
        raw: "INR 15,430.00 is paid from HSBC account XXXXXX6001 to SBI CARDS AND PAYMENT on 24-Oct-26 with ref 600000000002.", capturedAt: "2026-10-24T10:00:00Z" });
    if (back === 0) list.push({ id: "usd", date: "2026-10-19", merchant: "OPENAI *CHATGPT", bank: "HSBC", account: "1234", currency: "USD",
      amountPaise: -2000, template: "hsbc-cc-spend", confidence: "high", raw: "HSBC Credit Card used at OPENAI", capturedAt: "2026-10-19T10:00:00Z" });
    months[ym] = list.sort((a, b) => (a.date < b.date ? 1 : -1));
  }
  const rules = [
    { when: { direction: "in", text: "cashback" }, set: { category: "Cashback" } },
    { when: { merchant: "swiggy|zomato", direction: "out" }, set: { category: "Food" } },
    { when: { merchant: "uber|ola|rapido" }, set: { category: "Travel" } },
    { when: { merchant: "^Amazon$" }, set: { category: "Shopping" } },
    { when: { merchant: "^Google$" }, set: { category: "Subscriptions" } },
    { when: { merchant: "netflix|spotify" }, set: { category: "Subscriptions" } },
    { when: { merchant: "airtel|bescom|rent" }, set: { category: "Bills" } },
    { when: { merchant: "^BIGBASKET$" }, set: { category: "Groceries" } },
    { when: { merchant: "^RAHUL K$" }, set: { category: "Transfers" } },
  ];
  const unparsed = [
    { id: "u1", text: "Your a/c XX4321 has a pending mandate of Rs 499.00 for NETFLIX on 30-10-26." },
    { id: "u2", text: "Rs.250 sent via PhonePe to 98XXXXXX12 from A/c X7788." },
  ];
  fintrack.send = (message) => {
    console.log("[preview] Scriptable would run:", JSON.stringify(message, null, 1));
    const replies = {
      save: { ok: true },
      pasteSms: { ok: true, title: "Saved", message: "−₹120.00 Swiggy (preview)" },
      copy: { ok: true, title: "Copied", message: "" },
      deleteTx: { ok: true, title: "Deleted", message: "Preview only: nothing was deleted." },
      clearUnparsed: { ok: true, title: "Cleared", message: "", data: { months, rules, unparsed: [], version: "preview" } },
      update: { ok: true, title: "Updating", message: "Open FinTrack again when the update has finished." },
    };
    setTimeout(() => fintrack.reply(replies[message.action] || { ok: false, message: "Unknown action" }), 150);
  };
  const accounts = [
    { bank: "SBI", account: { last4: "4321", name: "Savings", upi: ["you.name@sbi"] }, cards: [{ last4: "5678", name: "Cashback", bills: ["SBI CARDS"] }] },
    { bank: "HSBC", account: { last4: "6001", name: "Savings", upi: ["you@okhsbc"] }, cards: [{ last4: "9012", name: "Premier", bills: ["HSBC CARD"] }] },
  ];
  fintrack.load({ months, rules, categories: { Transfers: { emoji: "↔︎", colour: "#8e8e93" } }, accounts, unparsed, version: "preview · fake data", currentMonth: "2026-10" });
</script>
</body>
</html>
